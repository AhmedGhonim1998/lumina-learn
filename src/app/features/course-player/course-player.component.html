<div class="flex flex-col lg:flex-row min-h-screen bg-gray-900 text-white">
  
  <div class="flex-grow p-4 lg:p-8">
    <div class="aspect-video w-full bg-black rounded-2xl overflow-hidden shadow-2xl border border-gray-800">
      <iframe *ngIf="currentVideoUrl" [src]="currentVideoUrl" class="w-full h-full" frameborder="0" allowfullscreen></iframe>
      <div *ngIf="!currentVideoUrl" class="flex items-center justify-center h-full text-gray-500">
        Select a lesson to start watching
      </div>
    </div>
    <h1 class="text-2xl font-bold mt-6">{{ activeLessonTitle }}</h1>
  </div>

  <div class="w-full lg:w-96 bg-gray-800 border-l border-gray-700 p-6 overflow-y-auto">
    <h2 class="text-xl font-bold mb-6 flex items-center gap-2">
      <span class="text-blue-500">📋</span> Course Content
    </h2>
    
    <div class="space-y-3">
  <div *ngFor="let lesson of lessons$ | async; let i = index" 
       (click)="selectLesson(lesson)"
       [ngClass]="activeLessonTitle === lesson.title ? 'bg-blue-600 border-blue-400' : 'bg-gray-700/50 hover:bg-gray-700'"
       class="p-4 rounded-xl cursor-pointer transition-all border border-transparent">
    
    <div class="flex items-center gap-3">
      <span *ngIf="activeLessonTitle === lesson.title" class="animate-pulse">▶️</span>
      <span class="text-xs text-gray-400">Lesson {{ i + 1 }}</span>
    </div>
    <p class="font-medium mt-1">{{ lesson.title }}</p>
  </div>
</div>
  </div>

</div>
