<div class="flex min-h-screen bg-gray-50">
  <aside class="w-64 bg-blue-700 text-white hidden md:block px-6 py-8">
    <h1 class="text-2xl font-bold mb-10">Lumina Learn</h1>
    <nav class="space-y-4">
      <a href="#" class="block p-3 bg-blue-800 rounded-lg">Dashboard</a>
      <a href="#" class="block p-3 hover:bg-blue-600 transition rounded-lg">My Courses</a>
      <a href="#" class="block p-3 hover:bg-blue-600 transition rounded-lg">Settings</a>
    </nav>
  </aside>

  <main class="flex-1 p-8">
    <header class="flex justify-between items-center mb-8">
      <div>
        <h2 class="text-3xl font-bold text-gray-800">Welcome Back!</h2>
        <button (click)="goToAddCourse()" 
        class="mb-6 bg-green-600 text-white px-6 py-3 rounded-xl font-bold hover:bg-green-700 transition">
  + Create New Course
</button>
        <p class="text-gray-500">Explore our latest courses and start learning.</p>
      </div>
      <button class="bg-blue-600 text-white px-6 py-2 rounded-full hover:bg-blue-700 shadow-lg transition">
        Profile
      </button>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
      <div *ngFor="let course of courses$ | async" 
           class="bg-white rounded-2xl overflow-hidden shadow-md hover:shadow-xl transition-shadow border border-gray-100">
        
        <div class="h-48 overflow-hidden bg-gray-200">
  <img [src]="course.imageUrl || 'https://via.placeholder.com/400x200?text=No+Image'" 
       [alt]="course.title"
       class="w-full h-full object-cover">
</div>

        <div class="p-6">
          <span class="text-xs font-semibold text-blue-600 bg-blue-50 px-2 py-1 rounded-md">New</span>
          <h3 class="text-xl font-bold mt-2 text-gray-800">{{ course.title }}</h3>
          <p class="text-gray-500 text-sm mt-1">Instructor: {{ course.instructor }}</p>
          
          <div class="flex justify-between items-center mt-6">
            <span class="text-2xl font-black text-gray-900">${{ course.price }}</span>
            

            <button (click)="deleteCourse(course.id)" 
        class="text-red-500 hover:text-red-700 text-sm font-bold ml-4">
  Delete
</button>

            <button (click)="viewCourse(course.id)" 
                    class="bg-gray-900 text-white px-4 py-2 rounded-lg text-sm">
            View Details
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
