<div class="min-h-screen flex items-center justify-center bg-gray-50 px-4">
  <div class="max-w-md w-full bg-white p-8 rounded-3xl shadow-xl border border-gray-100">
    <div class="text-center mb-8">
      <h2 class="text-3xl font-extrabold text-gray-900">Sign In</h2>
      <p class="text-gray-500 mt-2">Access your personalized learning space</p>
    </div>

    <div *ngIf="errorMessage" 
         [ngClass]="errorMessage.includes('⚠️') ? 'bg-amber-50 text-amber-700 border-amber-200' : 'bg-red-50 text-red-700 border-red-200'"
         class="p-4 mb-6 rounded-xl border flex items-start gap-3 animate-shake">
      <span class="text-lg">ℹ️</span>
      <p class="text-sm font-medium">{{ errorMessage }}</p>
    </div>

    <form (ngSubmit)="onLogin()" class="space-y-5">
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Email</label>
        <input [(ngModel)]="email" name="email" type="email" required
               class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-500 outline-none transition-all">
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Password</label>
        <input [(ngModel)]="password" name="password" type="password" required
               class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-500 outline-none transition-all">
      </div>

      <button type="submit" [disabled]="isLoading"
              class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition-all shadow-lg shadow-blue-100 disabled:opacity-50">
        <span *ngIf="!isLoading">Login</span>
        <span *ngIf="isLoading">Verifying...</span>
      </button>

      <div class="text-center mt-6">
        <p class="text-gray-600 text-sm">
          New here? <a routerLink="/register" class="text-blue-600 font-bold hover:underline">Create Account</a>
        </p>
      </div>
    </form>
  </div>
</div>
