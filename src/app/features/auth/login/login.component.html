<div class="min-h-screen flex items-center justify-center bg-gray-50 px-4">
  
  <div *ngIf="isDashboardLogin" class="max-w-md w-full bg-slate-900 p-10 rounded-[2.5rem] shadow-2xl border border-slate-800 animate-fade-in">
    <div class="text-center mb-10">
      <div class="inline-block p-4 bg-slate-800 rounded-2xl mb-4">
        <span class="text-3xl">🛡️</span>
      </div>
      <h2 class="text-3xl font-black text-white">Admin Control</h2>
      <p class="text-slate-400 mt-2 text-sm">Secure authorization required</p>
    </div>

    <form (ngSubmit)="onLogin()" class="space-y-6">
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2 ml-1">Admin Email</label>
        <input [(ngModel)]="email" name="email" type="email" class="w-full bg-slate-800 border-none rounded-2xl p-4 text-white focus:ring-2 focus:ring-blue-500 outline-none">
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2 ml-1">Password</label>
        <input [(ngModel)]="password" name="password" type="password" class="w-full bg-slate-800 border-none rounded-2xl p-4 text-white focus:ring-2 focus:ring-blue-500 outline-none">
      </div>
      
      <div *ngIf="errorMessage" class="text-red-400 text-sm text-center font-bold">{{errorMessage}}</div>

      <button type="submit" [disabled]="isLoading" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-4 rounded-2xl transition-all shadow-lg shadow-blue-900/20">
        {{ isLoading ? 'Authenticating...' : 'Access Terminal' }}
      </button>
    </form>
  </div>

  <div *ngIf="!isDashboardLogin" class="max-w-md w-full bg-white p-8 rounded-3xl shadow-xl border border-gray-100">
    <div class="text-center mb-8">
      <h2 class="text-3xl font-extrabold text-gray-900">Sign In</h2>
      <p class="text-gray-500 mt-2">Welcome back, happy learning!</p>
    </div>

    <form (ngSubmit)="onLogin()" class="space-y-5">
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Email</label>
        <input [(ngModel)]="email" name="email" type="email" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-500 outline-none">
      </div>
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Password</label>
        <input [(ngModel)]="password" name="password" type="password" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-500 outline-none">
      </div>

      <div *ngIf="errorMessage" class="text-red-500 text-sm text-center">{{errorMessage}}</div>

      <button type="submit" [disabled]="isLoading" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition-all shadow-lg">
        {{ isLoading ? 'Logging in...' : 'Login' }}
      </button>

      <div class="text-center mt-6">
        <p class="text-gray-600 text-sm">New here? <a routerLink="/register" class="text-blue-600 font-bold hover:underline">Create Account</a></p>
      </div>
    </form>
  </div>

</div>
