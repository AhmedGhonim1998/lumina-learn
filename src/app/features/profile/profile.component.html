<div class="min-h-screen bg-gray-50 py-10 px-4">
  <div class="max-w-4xl mx-auto">
    
    <div class="mb-8">
      <div *ngIf="!isEditing" class="bg-white rounded-3xl p-8 shadow-sm border border-gray-100 flex flex-col md:flex-row items-center justify-between gap-6 animate-in fade-in duration-300">
        <div class="flex items-center gap-6">
          <div class="w-24 h-24 rounded-full overflow-hidden border-4 border-blue-50 shadow-inner bg-blue-100 flex items-center justify-center">
            <img *ngIf="userPhoto" [src]="userPhoto" class="w-full h-full object-cover">
            <span *ngIf="!userPhoto" class="text-3xl font-bold text-blue-600">{{ userName?.charAt(0)?.toUpperCase() }}</span>
          </div>
          <div>
            <h1 class="text-3xl font-black text-gray-900">{{ userName }}'s Profile</h1>
            <p class="text-gray-500 font-medium">{{ userEmail }}</p>
          </div>
        </div>
        <button (click)="startEditing()" class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-2xl font-bold transition-all shadow-lg shadow-blue-200">
          Update Profile
        </button>
      </div>

      <div *ngIf="isEditing" class="bg-white rounded-3xl p-8 shadow-sm border border-blue-100 animate-in slide-in-from-top duration-500">
        <div class="flex justify-between items-center mb-8">
          <h2 class="text-2xl font-bold text-gray-800">Edit Your Information</h2>
          <button (click)="cancelEditing()" class="text-gray-400 hover:text-gray-600 p-2">✕ Close</button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block text-sm font-bold text-gray-700 mb-2">Full Name</label>
            <input [(ngModel)]="userName" type="text" class="w-full px-5 py-3 bg-gray-50 border border-gray-200 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none transition-all">
          </div>
          <div>
            <label class="block text-sm font-bold text-gray-700 mb-2">Profile Image URL</label>
            <input [(ngModel)]="userPhoto" type="text" placeholder="https://..." class="w-full px-5 py-3 bg-gray-50 border border-gray-200 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none transition-all">
          </div>
          <div class="md:col-span-2">
             <label class="block text-sm font-bold text-gray-700 mb-2">Change Password</label>
             <div class="flex gap-2">
               <input [(ngModel)]="newPassword" type="password" placeholder="Min 6 characters" class="flex-grow px-5 py-3 bg-gray-50 border border-gray-200 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none transition-all">
               <button (click)="changePassword()" class="bg-gray-800 text-white px-6 py-3 rounded-2xl font-bold hover:bg-black">Update Key</button>
             </div>
          </div>
        </div>

        <div class="mt-8 pt-6 border-t border-gray-100 flex gap-4">
          <button (click)="updateUserInfo()" class="flex-grow bg-green-600 hover:bg-green-700 text-white py-4 rounded-2xl font-black shadow-lg transition-all">
            Save Changes & Return
          </button>
        </div>
      </div>
    </div>

    <div class="bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden">
      <div class="p-6 border-b border-gray-50 flex justify-between items-center">
        <h2 class="text-xl font-bold flex items-center gap-2">
          🛒 My Learning Cart 
          <span class="text-sm bg-blue-50 text-blue-600 px-3 py-1 rounded-full">
            {{ (cartItems$ | async)?.length || 0 }} Items
          </span>
        </h2>
      </div>

      <div class="p-6 space-y-6">
        <div *ngFor="let item of cartItems$ | async" class="flex flex-col md:flex-row items-center gap-4 p-4 rounded-2xl hover:bg-gray-50 transition-colors border border-transparent hover:border-gray-100">
          <img [src]="item.imageUrl || 'assets/default-course.png'" 
               class="w-24 h-16 rounded-xl object-cover shadow-sm"
               onerror="this.src='https://via.placeholder.com/150'"> 
          <div class="flex-grow text-center md:text-left">
            <h3 class="font-bold text-gray-900">{{ item.title }}</h3>
            <p class="text-blue-600 font-bold">${{ item.price }}</p>
          </div>

          <button (click)="removeFromCart(item.id)" class="text-red-500 hover:bg-red-50 p-2 rounded-lg transition-all">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
            </svg>
          </button>
        </div>

        <div *ngIf="(cartItems$ | async)?.length === 0" class="text-center py-12">
          <p class="text-gray-400 mb-4 text-lg">Your cart is feeling a bit light...</p>
          <button routerLink="/courses" class="text-blue-600 font-bold hover:underline italic">
            Go find some amazing courses!
          </button>
        </div>
      </div>

      <div *ngIf="(cartItems$ | async)?.length! > 0" class="bg-gray-50 p-6 border-t border-gray-100">
        <div class="flex justify-between items-center mb-6">
          <span class="text-gray-600 font-medium">Total Amount:</span>
          <span class="text-3xl font-black text-gray-900">${{ totalPrice }}</span>
        </div>
        <button (click)="checkout()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-4 rounded-2xl shadow-lg transition-all flex items-center justify-center gap-3">
          <span>Confirm Checkout & Start Learning</span>
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        </button>
      </div>
    </div>

  </div>
</div>
