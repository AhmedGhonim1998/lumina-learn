<div class="min-h-screen bg-gray-50 flex items-center justify-center p-6">
  <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8">
    <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">Add New Course</h2>
    
    <form (ngSubmit)="onSave()" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700">Course Title</label>
        <input name="title" [(ngModel)]="course.title" type="text" placeholder="e.g. Angular Pro"
               class="w-full mt-1 p-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Instructor Name</label>
        <input name="instructor" [(ngModel)]="course.instructor" type="text"
               class="w-full mt-1 p-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Price ($)</label>
        <input name="price" [(ngModel)]="course.price" type="number"
               class="w-full mt-1 p-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Image URL</label>
        <input name="imageUrl" [(ngModel)]="course.imageUrl" type="text" placeholder="https://..."
               class="w-full mt-1 p-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
      </div>

      <button type="submit" 
              class="w-full bg-blue-600 text-white p-4 rounded-xl font-bold hover:bg-blue-700 transition-all">
        Save Course
      </button>
      
      <button type="button" routerLink="/dashboard" class="w-full text-gray-500 mt-2 text-sm">Cancel</button>
    </form>
  </div>
</div>
