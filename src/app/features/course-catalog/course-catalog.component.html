<div class="min-h-screen bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-7xl mx-auto text-center mb-12">
    <h1 class="text-4xl font-extrabold text-gray-900 sm:text-5xl">
      Explore Our <span class="text-blue-600">Premium Courses</span>
    </h1>
    <p class="mt-4 text-xl text-gray-500">Upgrade your skills with our expert-led tutorials.</p>
  </div>

  <div class="max-w-7xl mx-auto grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
    <div *ngFor="let course of courses$ | async" 
         class="bg-white rounded-3xl overflow-hidden shadow-sm hover:shadow-xl transition-shadow duration-300 border border-gray-100 flex flex-col">
      
      <div class="relative h-48 overflow-hidden">
        <img [src]="course.imageUrl" [alt]="course.title" class="w-full h-full object-cover transform hover:scale-105 transition-transform duration-500">
        <div class="absolute top-4 right-4 bg-blue-600 text-white px-3 py-1 rounded-full text-sm font-bold shadow-lg">
          ${{ course.price }}
        </div>
      </div>

      <div class="p-6 flex-grow">
        <h3 class="text-xl font-bold text-gray-900 mb-2">{{ course.title }}</h3>
        <p class="text-gray-600 text-sm line-clamp-2 mb-4">
          {{ course.description }}
        </p>
      </div>

      <div class="p-6 pt-0 mt-auto">
        <div class="flex items-center gap-2">
          <button (click)="addToCart(course)"
            class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl transition-colors flex items-center justify-center gap-2">
            <span>🛒 Add to Cart</span>
          </button>
          
          <button [routerLink]="['/course', course.id]"
            class="p-3 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="!(courses$ | async)?.length" class="text-center py-20">
    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mx-auto"></div>
    <p class="mt-4 text-gray-500">Loading amazing courses for you...</p>
  </div>
</div>
