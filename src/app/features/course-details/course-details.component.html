<div *ngIf="course" class="max-w-4xl mx-auto p-6">
  <h1 class="text-4xl font-bold mb-4">{{ course.title }}</h1>
  <p class="text-gray-600 mb-6">{{ course.description }}</p>

  <div class="bg-white rounded-2xl shadow-sm border p-6 mt-8">
    <h2 class="text-2xl font-bold mb-4">Course Content</h2>
    
    <div class="space-y-4">
      <div class="space-y-4">
  <p class="text-sm text-gray-500">Total Lessons: {{ (lessons$ | async)?.length }}</p>

  <div *ngFor="let lesson of lessons$ | async; let i = index" 
       class="flex justify-between items-center p-4 bg-gray-50 rounded-xl">
    <div class="flex items-center gap-3">
      <span class="font-bold text-blue-600">{{ i + 1 }}.</span>
      <span class="font-medium">{{ lesson.title }}</span>
    </div>
    <div class="flex items-center gap-2">
      <span class="text-xs text-gray-400">Order: {{ lesson.order }}</span>
      <span class="text-gray-400">🔒 Locked</span>
    </div>
  </div>
</div>
    </div>
  </div>
</div>
