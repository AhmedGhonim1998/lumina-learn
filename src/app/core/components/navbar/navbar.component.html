<nav class="fixed w-full z-50 top-0 start-0 border-b border-gray-100 bg-white/80 backdrop-blur-md">
  <div class="max-w-screen-xl flex flex-wrap items-center justify-between mx-auto p-4">
    
    <a routerLink="/" class="flex items-center space-x-3">
      <span class="text-2xl font-bold text-blue-600">Lumina<span class="text-gray-900">Learn</span></span>
    </a>

    <div class="flex md:order-2 space-x-3 items-center">
      <button *ngIf="!isLoggedIn" routerLink="/login" class="hidden md:block bg-blue-600 text-white px-6 py-2 rounded-full font-medium hover:bg-blue-700 transition shadow-lg shadow-blue-100">
        Get Started
      </button>

      <button *ngIf="isLoggedIn" (click)="logout()" class="hidden md:block text-gray-600 hover:text-red-600 font-medium transition">
        Logout
      </button>
      
      <button (click)="toggleMenu()" type="button" class="inline-flex items-center p-2 w-10 h-10 justify-center text-gray-500 rounded-xl md:hidden hover:bg-gray-100 focus:ring-2 focus:ring-gray-100">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path *ngIf="!isMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"/>
          <path *ngIf="isMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <div [class.hidden]="!isMenuOpen" class="items-center justify-between w-full md:flex md:w-auto md:order-1 transition-all">
      <ul class="flex flex-col p-4 md:p-0 mt-4 font-medium border border-gray-50 rounded-2xl bg-gray-50 md:space-x-8 md:flex-row md:mt-0 md:border-0 md:bg-transparent text-gray-700">
        <li>
          <a routerLink="/" (click)="isMenuOpen=false" routerLinkActive="text-blue-600" [routerLinkActiveOptions]="{exact: true}" class="block py-2 px-3 hover:text-blue-600 transition">Home</a>
        </li>
        <li>
          <a routerLink="/courses" (click)="isMenuOpen=false" routerLinkActive="text-blue-600" class="block py-2 px-3 hover:text-blue-600 transition">All Courses</a>
        </li>
        
        <li *ngIf="isLoggedIn && userRole === 'admin'" class="flex items-center">
  <a routerLink="/dashboard" 
     (click)="isMenuOpen=false" 
     routerLinkActive="text-blue-600" 
     class="block py-2 px-3 text-blue-600 font-bold transition-all hover:opacity-80 leading-none">
    Instructor Panel
  </a>
</li>
        <li class="md:hidden mt-4 border-t pt-4">
          <button *ngIf="!isLoggedIn" routerLink="/login" (click)="isMenuOpen=false" class="w-full bg-blue-600 text-white py-2 rounded-xl">Login</button>
          <button *ngIf="isLoggedIn" (click)="logout()" class="w-full text-red-500 py-2">Logout Account</button>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="h-20"></div>
